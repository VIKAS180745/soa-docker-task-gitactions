
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: recycling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam_2400032772
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_2400032772"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend/CrudService
      dockerfile: Dockerfile
    container_name: recycling-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DB_URL: jdbc:postgresql://postgresdb:5432/exam_2400032772
      DB_USERNAME: postgres
      DB_PASSWORD: root
      EUREKA_URL: http://host.docker.internal:8761/eureka/
    depends_on:
      postgresdb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./Frontend/frontend
      dockerfile: Dockerfile
    container_name: recycling-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
